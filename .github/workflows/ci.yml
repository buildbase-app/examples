# Every example installs, typechecks and builds on its own, with no BuildBase
# env set: an unconfigured example must build and show its setup notice rather
# than fail. Each keeps its upstream package manager and lockfile.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  example:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: with-buildbase
            pm: npm
            check: npx tsc --noEmit
            build: npm run build
          - example: ai-chatbot
            pm: pnpm
            check: pnpm exec tsc --noEmit
            # Migrations are skipped without POSTGRES_URL.
            build: pnpm build
          - example: saas-starter
            pm: pnpm
            check: pnpm typecheck
            build: pnpm build
          - example: nextjs-boilerplate
            pm: npm
            # Upstream's unit tests run in Vitest browser mode.
            check: npm run lint && npm run check:types && npx playwright install --with-deps chromium && npm test
            # Upstream's own CI build: an in-memory PGlite for the migrations.
            build: npm run build-local
          - example: ai-image-credits
            pm: npm
            check: npx tsc --noEmit
            build: npm run build
          - example: hackathon-starter
            pm: npm
            # Upstream's own checks: ESLint + Prettier, then mocha against an
            # in-memory MongoDB.
            check: npm run lint-check && npm test
            build: npm run scss
          - example: epic-stack
            pm: npm
            node: 22
            # Upstream's typed SQL needs a migrated database to generate from.
            build: cp .env.example .env && npx prisma migrate deploy && npx prisma generate --sql && npm run build
            check: npm run typecheck && npm run lint && npx vitest run
          - example: nestjs-boilerplate-api
            pm: npm
            build: npm run build
            check: npm run lint && npm test
          - example: admin-dashboard
            pm: pnpm
            check: pnpm lint && pnpm knip
            build: pnpm build
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: matrix.pm == 'pnpm'
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node || 24 }}
          cache: ${{ matrix.pm }}
          cache-dependency-path: ${{ matrix.example }}/${{ matrix.pm == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install
        run: ${{ matrix.pm == 'pnpm' && 'pnpm install --frozen-lockfile' || 'npm ci' }}

      # Build first: Next.js writes next-env.d.ts (gitignored) during the
      # build, and the typecheck needs it for image imports.
      - name: Build
        run: ${{ matrix.build }}

      - name: Check
        run: ${{ matrix.check }}
